[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qual"
version = "0.1.0"
description = "QUAL: label-free quantile alignment for combining time-series foundation models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["qual"]
